[package]
name = "reqon"
version = "0.23.2"
edition = "2024"
publish = false
description = "Reqon API client"
default-run = "reqon"

[features]
default = ["desktop"]
desktop = [
    "dep:eframe", "dep:egui_extras", "dep:image", "dep:rfd", "dep:notify",
    "dep:pulldown-cmark", "dep:portable-pty", "dep:vt100", "dep:fontdb",
    "dep:winit", "dep:windows-sys",
]

[[bin]]
name = "reqon"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "reqon-cli"
path = "src/bin/reqon-cli.rs"

[dependencies]
anyhow = "1"
csv = "1.4"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
eframe = { version = "=0.37.0", optional = true, default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu", "x11", "wayland"] }
egui_extras = { version = "=0.37.0", optional = true, default-features = false, features = ["svg"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "blocking", "json", "query", "form", "multipart", "gzip", "brotli", "deflate", "http2", "cookies", "charset", "socks", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rquickjs = "0.14"
rfd = { version = "0.15", optional = true }
base64 = "0.23"
sha2 = "0.10"
md-5 = "0.10"
md4 = "0.10"
http-body-util = "0.1"
cookie_store = "0.22"
hmac = "0.12"
sha1 = "0.10"
aws-sigv4 = { version = "1.6.4", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
bytes = "1"
http = "1"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-native-roots"] }
tonic-reflection = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
notify = { version = "8", optional = true }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", optional = true }
serde_yaml = "0.9"
encoding_rs = "0.8"
portable-pty = { version = "=0.9.0", optional = true }
vt100 = { version = "=0.18.1", optional = true }
p12-keystore = { version = "0.3.2", features = ["pbes1"] }
pkcs8 = { version = "0.10", features = ["encryption", "pem", "std"] }
ring = "0.17"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
des = "0.8"
fontdb = { version = "0.23", optional = true }
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winit = { version = "=0.30.13", optional = true, default-features = false }
windows-sys = { version = "0.61", optional = true, features = ["Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[patch.crates-io]
reqwest = { path = "vendor/reqwest" }
egui = { path = "vendor/egui" }
epaint = { path = "vendor/epaint" }
